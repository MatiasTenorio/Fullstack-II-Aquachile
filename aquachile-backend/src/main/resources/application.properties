spring.application.name=aquachile-backend

# Base de datos (valores por defecto = docker-compose local; en GitHub Actions se sobreescriben con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aquachile_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema lo crea Flyway (db/migration); Hibernate solo valida que las entidades coincidan con las tablas
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Healthcheck para el CI: /actuator/health
management.endpoints.web.exposure.include=health

# JWT (el secreto por defecto es solo para desarrollo; en despliegue se define JWT_SECRET)
app.jwt.secret=${JWT_SECRET:dev-secret-aquachile-solo-desarrollo-2026-no-usar-en-produccion}
app.jwt.expiration-minutes=480

# CORS: origen del frontend React (Vite)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Archivos adjuntos (CV e informe): maximo 5 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Google Drive (OAuth con cuenta propia, scope drive.file). Desactivado por defecto:
# sin credenciales la aplicacion arranca igual y los endpoints de archivos responden 503.
# Las credenciales reales van en application-local.properties (ignorado por git) o en variables de entorno.
app.drive.enabled=${DRIVE_ENABLED:false}
app.drive.client-id=${GOOGLE_CLIENT_ID:}
app.drive.client-secret=${GOOGLE_CLIENT_SECRET:}
app.drive.refresh-token=${GOOGLE_REFRESH_TOKEN:}
app.drive.root-folder-name=Candidatos

# Almacenamiento local de archivos: se usa mientras app.drive.enabled sea false
app.storage.local-path=${STORAGE_PATH:./almacen}