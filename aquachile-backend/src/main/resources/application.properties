spring.application.name=aquachile-backend

# Base de datos (valores por defecto = docker-compose local; en GitHub Actions se sobreescriben con variables de entorno)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aquachile_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# El esquema lo crea Flyway (db/migration); Hibernate solo valida que las entidades coincidan con las tablas
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Healthcheck para el CI: /actuator/health
management.endpoints.web.exposure.include=health

# JWT (el secreto por defecto es solo para desarrollo; en despliegue se define JWT_SECRET)
app.jwt.secret=${JWT_SECRET:dev-secret-aquachile-solo-desarrollo-2026-no-usar-en-produccion}
app.jwt.expiration-minutes=480

# CORS: origen del frontend React (Vite)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# Archivos adjuntos (CV e informe): maximo 5 MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Google Drive (OAuth con cuenta propia, scope drive.file). Desactivado por defecto:
# sin credenciales la aplicacion arranca igual y los endpoints de archivos responden 503.
# Las credenciales reales van en application-local.properties (ignorado por git) o en variables de entorno.
app.drive.enabled=${DRIVE_ENABLED:false}
app.drive.client-id=${GOOGLE_CLIENT_ID:}
app.drive.client-secret=${GOOGLE_CLIENT_SECRET:}
app.drive.refresh-token=${GOOGLE_REFRESH_TOKEN:}
app.drive.root-folder-name=Candidatos

# Almacenamiento local de archivos: se usa mientras app.drive.enabled sea false
app.storage.local-path=${STORAGE_PATH:./almacen}

# Correo para los codigos OTP de contrasena. Desactivado por defecto: el codigo se escribe en la consola
# del backend (modo desarrollo). Para enviar correos reales por Gmail define MAIL_ENABLED=true,
# MAIL_USERNAME (la cuenta de Gmail) y MAIL_PASSWORD (una "contrasena de aplicacion" de Google, no la
# contrasena normal). Igual que las credenciales de Drive, van en application-local.properties o en
# variables de entorno, nunca en este archivo.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${spring.mail.username}}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# El healthcheck no debe depender del servidor de correo (lo usa el CI y no tiene credenciales)
management.health.mail.enabled=false

# Direccion publica del frontend: se usa en los enlaces de los eventos y al volver desde Google
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Google Calendar: cada evaluador conecta su propia cuenta y sus entrevistas se copian a su calendario.
# Desactivado por defecto: sin esto el sistema funciona igual, solo con el calendario interno.
# Para activarlo define GOOGLE_CALENDAR_ENABLED=true. Por defecto usa el mismo cliente OAuth de Drive
# (app.drive.client-id / client-secret); ese cliente debe ser de tipo "Aplicacion web" y tener
# registrada la redirect-uri de abajo. La guia paso a paso esta en doc/google-calendar.md.
app.google.calendar.enabled=${GOOGLE_CALENDAR_ENABLED:false}
app.google.calendar.client-id=${GOOGLE_CALENDAR_CLIENT_ID:${app.drive.client-id}}
app.google.calendar.client-secret=${GOOGLE_CALENDAR_CLIENT_SECRET:${app.drive.client-secret}}
app.google.calendar.redirect-uri=${GOOGLE_CALENDAR_REDIRECT_URI:http://localhost:8080/google/calendar/callback}
# Direcciones de Google; no hace falta cambiarlas (se pueden reemplazar para pruebas)
app.google.calendar.auth-url=https://accounts.google.com/o/oauth2/v2/auth
app.google.calendar.token-url=https://oauth2.googleapis.com/token
app.google.calendar.userinfo-url=https://www.googleapis.com/oauth2/v3/userinfo
app.google.calendar.revoke-url=https://oauth2.googleapis.com/revoke
app.google.calendar.api-url=https://www.googleapis.com/calendar/v3
