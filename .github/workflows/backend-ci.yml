name: Backend CI

on:
  push:
    paths:
      - "aquachile-backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "aquachile-backend/**"
      - "docker-compose.yml"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

jobs:
  build-and-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: aquachile_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d aquachile_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: aquachile-backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar y ejecutar pruebas
        run: mvn -B verify

      - name: Guardar reportes de pruebas si fallan
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: aquachile-backend/target/surefire-reports

  docker-up:
    name: Levantar la aplicacion completa con Docker
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir y levantar servicios
        run: docker compose up -d --build

      - name: Esperar a que el backend responda
        run: |
          for i in $(seq 1 40); do
            if curl -fs http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Backend arriba"
              exit 0
            fi
            sleep 3
          done
          echo "El backend no levanto a tiempo"
          docker compose logs backend
          exit 1

      - name: Apagar servicios
        if: always()
        run: docker compose down -v
